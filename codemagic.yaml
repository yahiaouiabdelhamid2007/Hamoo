workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Extract zip and build APK
        script: |
          if [ -f calorie-lens.zip ]; then
            unzip -o calorie-lens.zip
          fi
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
