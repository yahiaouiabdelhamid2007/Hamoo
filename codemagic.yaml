workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      android_signing:
        - none
      groups:
        - none
      vars:
        PACKAGE_NAME: "com.calorie.lens"
    scripts:
      - name: Build Android Debug APK
        script: |
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
