name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unpack project
      run: |
        if [ -f calorie-lens.zip ]; then
          unzip -o calorie-lens.zip
          if [ -d calorie-lens ]; then
            cp -rf calorie-lens/* .
          fi
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install and Run Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10'

    - name: Build APK with Gradle
      run: |
        gradle assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CalorieLens-APK
        path: app/build/outputs/apk/debug/*.apk        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CalorieLens-APK
        path: app/build/outputs/apk/debug/*.apk
