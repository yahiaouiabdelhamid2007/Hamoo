name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Find and extract project files
      run: |
        echo "Current directory contents:"
        ls -la
        # Find any zip file and extract it
        for f in *.zip; do
          if [ -f "$f" ]; then
            echo "Extracting $f..."
            unzip -o "$f"
          fi
        done
        # If app folder is inside a subfolder, bring it to root
        if [ ! -d "app" ]; then
          TARGET_DIR=$(find . -maxdepth 2 -type d -name "app" | head -n 1)
          if [ -n "$TARGET_DIR" ]; then
            PARENT_DIR=$(dirname "$TARGET_DIR")
            echo "Moving files from $PARENT_DIR to current directory..."
            cp -rf "$PARENT_DIR"/* .
          fi
        fi
        echo "Root directory after extraction:"
        ls -la

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle 9.3.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Build Debug APK
      run: |
        gradle :app:assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CalorieLens-APK
        path: "**/build/outputs/apk/debug/*.apk"
